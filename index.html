<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="theme-color" content="#03050c" />
  <meta property="og:title" content="Meloveme · 欢迎来到我的小站" />
  <meta property="og:description" content="一些用代码写的小东西：粒子圣诞树、爱心、烟花与星空。" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cdefs%3E%3CradialGradient%20id='g'%3E%3Cstop%20offset='0'%20stop-color='%23fff8e2'/%3E%3Cstop%20offset='1'%20stop-color='%23e9b45d'/%3E%3C/radialGradient%3E%3C/defs%3E%3Cpolygon%20points='50,5%2061,38%2095,38%2068,58%2078,93%2050,72%2022,93%2032,58%205,38%2039,38'%20fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./home.css" />
</head>
<body>
  <!-- 背景星点 -->
  <div class="sky" aria-hidden="true"></div>

  <main class="gate">
    <p class="gate__kicker">Meloveme</p>
    <h1 class="gate__title">欢迎来到我的小站</h1>
    <p class="gate__intro">这里收藏了一些用代码点亮的小东西。<br />挑一个，开始吧。</p>

    <nav class="gate__grid" aria-label="内容入口">
      <a class="card card--active" href="./tree.html">
        <svg class="card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M12 3 8.4 8.6h7.2L12 3Z" />
          <path d="M12 8.6 6.4 14.6h11.2L12 8.6Z" />
          <path d="M12 14.6 4.5 20.5h15L12 14.6Z" />
          <path d="M12 20.5V22" />
        </svg>
        <span class="card__name">圣诞树</span>
        <span class="card__note">3D 粒子 · 可进入</span>
      </a>

      <a class="card card--active card--heart" href="./heart.html">
        <svg class="card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M12 20.2 4.6 12.8C2.6 10.8 2.6 7.5 4.6 5.6c2-1.9 5.2-1.9 7.2 0l.2.2.2-.2c2-1.9 5.2-1.9 7.2 0 2 1.9 2 5.2 0 7.2L12 20.2Z" />
        </svg>
        <span class="card__name">爱心</span>
        <span class="card__note">立体粒子 · 可进入</span>
      </a>

      <a class="card card--active card--firework" href="./fireworks.html">
        <svg class="card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="1.6" />
          <path d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2M5.2 5.2l2.3 2.3M16.5 16.5l2.3 2.3M18.8 5.2l-2.3 2.3M7.5 16.5l-2.3 2.3" />
        </svg>
        <span class="card__name">烟花</span>
        <span class="card__note">点击燃放 · 可进入</span>
      </a>

      <a class="card card--active card--stars" href="./stars.html">
        <svg class="card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M12 3c.4 4.4 2.2 6.2 6.6 6.6-4.4.4-6.2 2.2-6.6 6.6-.4-4.4-2.2-6.2-6.6-6.6C9.8 9.2 11.6 7.4 12 3Z" />
          <path d="M18 16.5c.2 1.8.9 2.5 2.7 2.7-1.8.2-2.5.9-2.7 2.7-.2-1.8-.9-2.5-2.7-2.7 1.8-.2 2.5-.9 2.7-2.7Z" />
        </svg>
        <span class="card__name">星空</span>
        <span class="card__note">深空星野 · 可进入</span>
      </a>

      <div class="card card--wide card--soon" aria-disabled="true">
        <svg class="card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="3.2" />
          <path d="M5.5 20c0-3.6 2.9-5.8 6.5-5.8s6.5 2.2 6.5 5.8" />
        </svg>
        <span class="card__name">关于</span>
        <span class="card__note">敬请期待</span>
      </div>
    </nav>

    <p class="gate__foot">更多内容陆续上线</p>
  </main>

</html>
